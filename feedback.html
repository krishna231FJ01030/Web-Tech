<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Feedback Form</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

<div class="container">
    <div class="top-nav">
        <a href="home.html">🏠 Home</a>
        <a href="login.html">🔑 Login</a>
        <a href="registration.html">📝 Register</a>
        <a href="profile.html">👤 Profile</a>
        <a href="courses.html">📚 Courses</a>
        <a href="tables.html">📅 Timetable</a>
        <a href="feedback.html" class="active">💬 Feedback</a>
        <a href="contact.html">📞 Contact</a>
    </div>

    <h2>💬 Feedback Form</h2>

    <div id="alertBox" class="alert alert-success">Thank you for your feedback! Redirecting...</div>

    <form id="feedbackForm" onsubmit="handleFeedback(event)">

        <div>
            <label for="name">Name:</label>
            <input type="text" id="name" name="name" placeholder="Enter your name" required>
        </div>

        <div>
            <label for="email">Email:</label>
            <input type="email" id="email" name="email" placeholder="Enter your email" required>
        </div>

        <div>
            <label>Rating:</label>
            <div class="radio-group">
                <label><input type="radio" name="rating" value="Excellent" required> Excellent</label>
                <label><input type="radio" name="rating" value="Good"> Good</label>
                <label><input type="radio" name="rating" value="Average"> Average</label>
                <label><input type="radio" name="rating" value="Poor"> Poor</label>
            </div>
        </div>

        <div>
            <label>What did you like?</label>
            <div class="checkbox-group">
                <label><input type="checkbox" name="like" value="Content"> Content</label>
                <label><input type="checkbox" name="like" value="Teaching"> Teaching</label>
                <label><input type="checkbox" name="like" value="Activities"> Activities</label>
            </div>
        </div>

        <div>
            <label for="feedback">Feedback:</label>
            <textarea id="feedback" name="feedback" rows="5" placeholder="Share your detailed feedback here..." required></textarea>
        </div>

        <div class="button-group">
            <input type="submit" value="Submit Feedback">
            <input type="reset" value="Reset">
        </div>

    </form>
</div>

<script>
function handleFeedback(event) {
    event.preventDefault();
    const alertBox = document.getElementById('alertBox');
    alertBox.style.display = 'block';
    setTimeout(() => {
        window.location.href = 'home.html';
    }, 1200);
}
</script>

</body>
</html>
