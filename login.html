<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Form</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

<div class="container">
    <div class="top-nav">
        <a href="home.html">🏠 Home</a>
        <a href="login.html" class="active">🔑 Login</a>
        <a href="registration.html">📝 Register</a>
        <a href="profile.html">👤 Profile</a>
        <a href="courses.html">📚 Courses</a>
        <a href="tables.html">📅 Timetable</a>
        <a href="feedback.html">💬 Feedback</a>
        <a href="contact.html">📞 Contact</a>
    </div>

    <h2>🔑 Login Form</h2>

    <div id="alertBox" class="alert alert-success">Login successful! Redirecting...</div>

    <form id="loginForm" onsubmit="handleLogin(event)">

        <div>
            <label for="username">Username:</label>
            <input type="text" id="username" name="username" placeholder="Enter your username" required>
        </div>

        <div>
            <label for="email">Email Address:</label>
            <input type="email" id="email" name="email" placeholder="Enter your email" required>
        </div>

        <div>
            <label for="password">Password:</label>
            <input type="password" id="password" name="password" placeholder="Enter your password" required>
        </div>

        <div class="button-group">
            <input type="submit" value="Login">
            <input type="reset" value="Reset">
        </div>

        <p style="margin-top: 16px; font-size: 0.9rem; color: var(--text-secondary);">
            Don't have an account? <a href="registration.html">Register here</a>
        </p>

    </form>
</div>

<script>
function handleLogin(event) {
    event.preventDefault();
    const alertBox = document.getElementById('alertBox');
    alertBox.style.display = 'block';
    setTimeout(() => {
        window.location.href = 'home.html';
    }, 1200);
}
</script>

</body>
</html>
